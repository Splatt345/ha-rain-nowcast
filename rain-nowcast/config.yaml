---
name: Rain Nowcast
version: "1.0.0"
slug: rain_nowcast
description: Live rain radar and a 60-minute minute-by-minute rain forecast
url: https://github.com/efernet/ha-rain-nowcast
ingress: true
ingress_port: 8099
panel_icon: mdi:weather-pouring
panel_title: Rain
# amd64 only, deliberately. aarch64 was advertised but never shipped, so a Pi
# install would have failed at pull time; declaring only what is built means the
# Supervisor hides the add-on there instead.
arch:
  - amd64
# Sensors go out over MQTT when a broker is configured, and fall back to the
# core REST API when there isn't one.
homeassistant_api: true
services:
  - mqtt:want
options:
  latitude: 50.85
  longitude: 4.35
  api_key: ""
  history_minutes: 60
  forecast_minutes: 60
  ensemble_members: 12
  publish_sensors: true
  use_model: true
  # Leave empty on Home Assistant OS/Supervised: the Supervisor supplies the
  # broker. Only needed on Home Assistant Container or docker-compose, where
  # there is no Supervisor to ask and sensors would otherwise not publish.
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  latitude: float
  longitude: float
  api_key: password
  history_minutes: int(15,180)
  forecast_minutes: int(15,120)
  ensemble_members: int(1,24)
  publish_sensors: bool
  use_model: bool
  mqtt_host: str?
  mqtt_port: int(1,65535)?
  mqtt_username: str?
  mqtt_password: password?
