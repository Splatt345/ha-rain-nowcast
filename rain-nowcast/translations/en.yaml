# Labels and help text for the add-on's Configuration tab.
#
# Without this file the Supervisor renders the raw option keys - "mqtt_host",
# "use_model" - with no explanation, and the two that most often go wrong
# (leaving mqtt_host set on HA OS, and the latitude/longitude having to be
# inside the radar crop) have no way to say so at the point of use.
#
# Keys here must match config.yaml's `options` exactly.
configuration:
  latitude:
    name: Latitude
    description: >-
      Latitude of the spot the minute-by-minute graph and all the sensors are
      for. Must be inside the radar area: 49.0 to 51.8 N. Outside it you get the
      nearest covered point and a warning on the panel.
  longitude:
    name: Longitude
    description: >-
      Longitude of that spot. Must be inside the radar area: 2.0 to 6.8 E,
      which is Belgium plus a margin.
  api_key:
    name: MeteoGate API key
    description: >-
      Free key from https://meteogate.eu - sign in with GitHub, Google or Azure
      AD, no approval wait. Required: anonymous access to the radar is
      rate-limited well below the once-every-5-minutes this needs.
  history_minutes:
    name: Radar history
    description: >-
      Minutes of past radar to show on the map and feed the forecast. More
      history gives the motion estimate more to work with; 60 is what the
      accuracy figures were measured at.
  forecast_minutes:
    name: Forecast horizon
    description: >-
      How far ahead to forecast. Useful skill is largely gone past about 35
      minutes - the second half hour is a hint rather than a prediction.
  ensemble_members:
    name: Ensemble members
    description: >-
      How many forecast runs to average. Lower is faster but coarsens the rain
      chance, which can only be reported in steps of 1/N - at 4 members it can
      only ever say 0, 25, 50, 75 or 100 percent. 12 takes about 12 seconds per
      cycle on a desktop CPU.
  publish_sensors:
    name: Publish sensors
    description: >-
      Create the eight Home Assistant entities. Turn this OFF if you are using
      the separate Rain Nowcast integration instead, or you will get two copies
      of every entity with the second suffixed _2.
  use_model:
    name: Use the neural network
    description: >-
      Combine the radar extrapolation with the bundled SmaAt-UNet model. Adds
      about 0.25 seconds per cycle and measurably improves the forecast. Turn it
      off to run plain pysteps STEPS.
  mqtt_host:
    name: MQTT broker host
    description: >-
      LEAVE THIS EMPTY on Home Assistant OS and Supervised - the Supervisor
      supplies the broker automatically and filling it in overrides that. Only
      needed on Home Assistant Container or docker-compose, where there is no
      Supervisor to ask and the sensors would otherwise not publish at all.
  mqtt_port:
    name: MQTT broker port
    description: Only used when a broker host is set above.
  mqtt_username:
    name: MQTT username
    description: Only if your broker requires authentication.
  mqtt_password:
    name: MQTT password
    description: Only if your broker requires authentication.
